[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  timeout = 26

# FotMob calendar proxy (ICS feed)
[[redirects]]
  from = "/fotmob-proxy/*"
  to = "https://pub.fotmob.com/:splat"
  status = 200
  force = true
  [redirects.headers]
    "User-Agent" = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

# FotMob API proxy (team/match data)
[[redirects]]
  from = "/fotmob-www/*"
  to = "https://www.fotmob.com/:splat"
  status = 200
  force = true
  [redirects.headers]
    "User-Agent" = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
    "Referer" = "https://www.fotmob.com"

# FotMob image proxy (avoids hotlink blocking)
[[redirects]]
  from = "/fotmob-images/*"
  to = "https://images.fotmob.com/:splat"
  status = 200
  force = true
  [redirects.headers]
    "User-Agent" = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
    "Referer" = "https://www.fotmob.com"

# ESPN public API proxy (Liga Argentina + Copa Libertadores standings)
[[redirects]]
  from = "/espn-proxy/*"
  to = "https://site.api.espn.com/:splat"
  status = 200
  force = true
  [redirects.headers]
    "User-Agent" = "Mozilla/5.0"
    "Accept" = "application/json"

# Promiedos proxy (annual standings)
[[redirects]]
  from = "/promiedos-proxy/*"
  to = "https://www.promiedos.com.ar/:splat"
  status = 200
  force = true
  [redirects.headers]
    "User-Agent" = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
    "Accept" = "text/html,*/*"

# API redirects
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA routing - redirect all routes to index.html (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; worker-src blob: 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://*.supabase.co https://docs.google.com https://site.api.espn.com wss://*.supabase.co https://api.anthropic.com; frame-ancestors 'none';"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
